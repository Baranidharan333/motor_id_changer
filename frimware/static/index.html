<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor ID Configurator</title>
<style>
  :root {
    --bg: #eef4fc;
    --panel: #ffffff;
    --border: #cfe0f5;
    --text: #0b2545;
    --muted: #5779a0;
    --accent: #1a56b0;
    --accent-text: #ffffff;
    --ok: #1a7f4b;
    --ok-bg: #e8f6ee;
    --bad: #c0362c;
    --bad-bg: #fbebea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    background: var(--bg);
    color: var(--text);
    padding: 32px 24px;
    max-width: 880px;
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 20px; }
  h2 { font-size: 13px; margin: 0 0 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 9px;
    font-size: 13px;
    width: 90px;
  }
  input:focus { outline: 2px solid #a9c8ef; outline-offset: -1px; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: var(--accent-text);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { opacity: 0.85; }
  button.secondary { background: #fff; color: var(--text); border-color: var(--border); }
  button.danger { background: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  tr.selected { background: #e3edfb; }
  tbody tr:hover { background: #f4f8fd; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  #selectedInfo { font-size: 13px; line-height: 1.7; }
  #selectedInfo .none { color: var(--muted); }
  #log {
    background: #f4f8fd;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    color: var(--muted);
  }
  #log .line.ok { color: var(--ok); }
  #log .line.bad { color: var(--bad); }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>

<h1>Motor ID Configurator</h1>

<div class="panel">
  <h2>Scan bus</h2>
  <div class="row">
    <div class="field"><label>Start id</label><input id="scanStart" type="number" value="1"></div>
    <div class="field"><label>End id</label><input id="scanEnd" type="number" value="16"></div>
    <div class="field"><label>Timeout (s)</label><input id="scanTimeout" type="number" step="0.1" value="0.5"></div>
    <button id="scanBtn" style="align-self:flex-end">Scan</button>
    <span id="scanStatus" class="hint"></span>
  </div>
  <table id="scanTable" style="display:none">
    <thead><tr><th>CAN id</th><th>State</th><th>Feedback id</th><th>Pos (rad)</th><th></th></tr></thead>
    <tbody id="scanBody"></tbody>
  </table>
  <div class="row" style="margin-top:10px">
    <button id="zeroAllBtn" class="danger" disabled>Set zero position on ALL scanned motors</button>
  </div>
</div>

<div class="panel">
  <h2>Selected motor</h2>
  <div id="selectedInfo"><span class="none">none selected</span></div>
  <div class="row" style="margin-top:10px">
    <button id="refreshInfoBtn" class="secondary" disabled>Refresh info</button>
    <button id="zeroBtn" class="danger" disabled>Set zero position</button>
  </div>

  <hr style="border:none;border-top:1px solid var(--border);margin:18px 0">

  <h2>Set CAN id / feedback id</h2>
  <div class="row">
    <div class="field"><label>New CAN id</label><input id="newCanId" type="number" placeholder="eg 1"></div>
    <div class="field"><label>New feedback id</label><input id="newFeedbackId" type="number" placeholder="eg 11"></div>
    <button id="setIdBtn" class="danger" style="align-self:flex-end" disabled>Set &amp; save to flash</button>
  </div>
</div>

<div class="panel">
  <h2>Log</h2>
  <div id="log"><span class="line">ready.</span></div>
</div>

<script>
const state = { selectedId: null, lastScanIds: [], opInFlight: false };
let pollInFlight = false;

function el(id) { return document.getElementById(id); }

function logLine(text, cls) {
  const line = document.createElement("div");
  line.className = "line" + (cls ? " " + cls : "");
  line.textContent = text;
  el("log").appendChild(line);
  el("log").scrollTop = el("log").scrollHeight;
}

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`${res.status}: ${text}`);
  }
  return res.json();
}

function renderInfo(id, info) {
  const box = el("selectedInfo");
  if (id === null) {
    box.innerHTML = '<span class="none">none selected</span>';
    el("setIdBtn").disabled = true;
    el("refreshInfoBtn").disabled = true;
    el("zeroBtn").disabled = true;
    return;
  }
  el("setIdBtn").disabled = false;
  el("refreshInfoBtn").disabled = false;
  el("zeroBtn").disabled = false;
  if (!info) {
    box.innerHTML = `<b>CAN id ${id}</b> &mdash; <span class="pill bad">no response</span>`;
    return;
  }
  box.innerHTML = `
    <b>CAN id ${id}</b> &mdash; <span class="pill ok">${info.state}</span>
    <span class="pill ok" title="updating automatically">&#9679; live</span><br>
    feedback id: <b>${info.feedback_id}</b><br>
    position: ${info.position} rad &middot; velocity: ${info.velocity} rad/s &middot; torque: ${info.torque} Nm<br>
    T_mos: ${info.t_mos}&deg;C &middot; T_rotor: ${info.t_rotor}&deg;C
  `;
}

async function pollTick() {
  if (state.selectedId === null || state.opInFlight || pollInFlight || document.hidden) return;
  pollInFlight = true;
  try {
    const res = await api("/api/probe", { id: state.selectedId, timeout: 0.3 });
    if (state.selectedId === res.id) renderInfo(res.id, res.info);
  } catch (e) {
    // transient poll errors shouldn't spam the log -- next tick will retry
  } finally {
    pollInFlight = false;
  }
}
setInterval(pollTick, 500);

// Heartbeat so the board's status LED knows this page is connected
// (green while connected, blinking white once it stops).
setInterval(() => { fetch("/api/status").catch(() => {}); }, 2000);

async function selectMotor(id) {
  state.selectedId = id;
  logLine(`Selecting CAN id ${id}, pinging...`);
  try {
    const res = await api("/api/probe", { id, timeout: 0.4 });
    renderInfo(id, res.info);
    logLine(res.info ? `  responded: ${res.info.state}` : "  no response", res.info ? "ok" : "bad");
  } catch (e) {
    logLine("Error: " + e.message, "bad");
  }
  highlightSelectedRow();
}

function highlightSelectedRow() {
  document.querySelectorAll("#scanBody tr").forEach(tr => {
    tr.classList.toggle("selected", Number(tr.dataset.id) === state.selectedId);
  });
}

el("scanBtn").onclick = async () => {
  const start = Number(el("scanStart").value);
  const end = Number(el("scanEnd").value);
  const timeout = Number(el("scanTimeout").value);
  el("scanBtn").disabled = true;
  state.opInFlight = true;
  el("scanStatus").textContent = "scanning...";
  logLine(`Scanning ids ${start}-${end} (timeout ${timeout}s)...`);
  try {
    const res = await api("/api/scan", { start, end, timeout });
    const body = el("scanBody");
    body.innerHTML = "";
    state.lastScanIds = res.motors.map(m => m.id);
    el("zeroAllBtn").disabled = state.lastScanIds.length === 0;
    if (res.motors.length === 0) {
      el("scanStatus").textContent = "no motors found";
      logLine("No motors found.", "bad");
      el("scanTable").style.display = "none";
    } else {
      el("scanStatus").textContent = `${res.motors.length} found`;
      logLine(`Found ${res.motors.length} motor(s).`, "ok");
      el("scanTable").style.display = "";
      for (const m of res.motors) {
        const tr = document.createElement("tr");
        tr.dataset.id = m.id;
        tr.innerHTML = `
          <td>${m.id}</td>
          <td>${m.info ? m.info.state : "-"}</td>
          <td>${m.info ? m.info.feedback_id : "-"}</td>
          <td>${m.info ? m.info.position : "-"}</td>
          <td><button class="secondary select-row-btn">Select</button></td>
        `;
        tr.querySelector(".select-row-btn").onclick = () => selectMotor(m.id);
        body.appendChild(tr);
      }
      highlightSelectedRow();
    }
  } catch (e) {
    el("scanStatus").textContent = "error";
    logLine("Error: " + e.message, "bad");
  } finally {
    el("scanBtn").disabled = false;
    state.opInFlight = false;
  }
};

el("refreshInfoBtn").onclick = async () => {
  if (state.selectedId === null) return;
  await selectMotor(state.selectedId);
};

el("zeroBtn").onclick = async () => {
  if (state.selectedId === null) return;
  if (!confirm(`Set the CURRENT shaft position as zero for CAN id ${state.selectedId}?`)) {
    logLine("Cancelled.");
    return;
  }
  el("zeroBtn").disabled = true;
  state.opInFlight = true;
  try {
    const res = await api("/api/zero", { id: state.selectedId });
    for (const line of res.log) logLine(line, "ok");
    await selectMotor(state.selectedId);
  } catch (e) {
    logLine("Error: " + e.message, "bad");
  } finally {
    el("zeroBtn").disabled = false;
    state.opInFlight = false;
  }
};

el("zeroAllBtn").onclick = async () => {
  if (state.lastScanIds.length === 0) return;
  if (!confirm(`Set the CURRENT shaft position as zero for ALL ${state.lastScanIds.length} scanned motor(s): ${state.lastScanIds.join(", ")}?`)) {
    logLine("Cancelled.");
    return;
  }
  el("zeroAllBtn").disabled = true;
  state.opInFlight = true;
  try {
    const res = await api("/api/zero_all", { ids: state.lastScanIds });
    for (const line of res.log) logLine(line, "ok");
  } catch (e) {
    logLine("Error: " + e.message, "bad");
  } finally {
    el("zeroAllBtn").disabled = false;
    state.opInFlight = false;
  }
};

el("setIdBtn").onclick = async () => {
  if (state.selectedId === null) return;
  const newCanId = el("newCanId").value.trim();
  const newFeedbackId = el("newFeedbackId").value.trim();
  if (newCanId === "" && newFeedbackId === "") {
    logLine("Nothing to do -- enter a new CAN id and/or feedback id.", "bad");
    return;
  }
  const summary = [
    newCanId !== "" ? `CAN id -> ${newCanId}` : null,
    newFeedbackId !== "" ? `feedback id -> ${newFeedbackId}` : null,
  ].filter(Boolean).join(", ");
  if (!confirm(`Reprogram motor currently at CAN id ${state.selectedId}: ${summary}?\n\n` +
    `This writes to flash. If any OTHER motor on the bus also currently answers to CAN id ` +
    `${state.selectedId}, it will be reprogrammed too -- make sure only one motor at that id is ` +
    `connected/powered right now.`)) {
    logLine("Cancelled.");
    return;
  }

  el("setIdBtn").disabled = true;
  state.opInFlight = true;
  try {
    const res = await api("/api/set_id", {
      current_id: state.selectedId,
      new_can_id: newCanId === "" ? null : Number(newCanId),
      new_feedback_id: newFeedbackId === "" ? null : Number(newFeedbackId),
    });
    for (const line of res.log) logLine(line, res.ok ? "ok" : "bad");
    if (res.ok) {
      el("newCanId").value = "";
      el("newFeedbackId").value = "";
      await selectMotor(res.active_id);
    }
  } catch (e) {
    logLine("Error: " + e.message, "bad");
  } finally {
    el("setIdBtn").disabled = false;
    state.opInFlight = false;
  }
};

</script>
</body>
</html>
